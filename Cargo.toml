[package]
name = "patcherd"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cfi2017/patcherd"
license = "MIT"

[[bin]]
name = "patcher"
path = "src/bin/patcher.rs"

[[bin]]
name = "webhook"
path = "src/bin/webhook.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
memchr = "2"

# Kubernetes
kube = { version = "0.98", features = ["client", "runtime", "admission"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
json-patch = "3"

# HTTP / async
tokio = { version = "1", features = ["full"] }
warp = { version = "0.3", features = ["tls"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false
