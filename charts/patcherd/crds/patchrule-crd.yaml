apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: patchrules.patcher.k8s.io
spec:
  group: patcher.k8s.io
  names:
    kind: PatchRule
    listKind: PatchRuleList
    plural: patchrules
    singular: patchrule
    shortNames:
      - pr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Selector
          type: string
          jsonPath: .spec.selector.matchLabels
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - selector
                - patches
              properties:
                selector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        required:
                          - key
                          - operator
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          values:
                            type: array
                            items:
                              type: string
                patches:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - binaryPath
                      - find
                      - replace
                    properties:
                      binaryPath:
                        type: string
                        pattern: "^/.*"
                      find:
                        type: string
                        minLength: 2
                      replace:
                        type: string
                        minLength: 2
                      containerName:
                        type: string
                patcherImage:
                  type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
