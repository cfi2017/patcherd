apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patcherd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patcherd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "patcherd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patcherd.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "patcherd.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: "{{ .Values.image.webhook.repository }}:{{ include "patcherd.webhookTag" . }}"
          imagePullPolicy: {{ .Values.image.webhook.pullPolicy }}
          args:
            - --webhook-port={{ .Values.webhook.port }}
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --health-port={{ .Values.webhook.healthPort }}
          ports:
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.webhook.healthPort }}
              protocol: TCP
          volumeMounts:
            - name: tls-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ include "patcherd.tlsSecretName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
