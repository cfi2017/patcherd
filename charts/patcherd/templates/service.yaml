apiVersion: v1
kind: Service
metadata:
  name: {{ include "patcherd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patcherd.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "patcherd.selectorLabels" . | nindent 4 }}
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
